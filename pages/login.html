<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/images/favicon.png">
  <meta name="theme-color" content="#9a3608">
  <title>Login | ATLAS PSU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="../assets/js/app-core.js"></script>
  <link rel="stylesheet" href="../assets/css/main-style.css">
  <script src="../assets/js/login-script.js" defer></script>
</head>
<body class="page-login">

  <main class="login-card">
    <a href="../index.html" class="login-back">&larr; Back</a>

    <div class="brand-top">ATLAS PSU</div>
    <h1>Welcome</h1>
    <p class="subtitle">A Teaching Load Assignment and Management System</p>

    <!-- Who is signing in -->
    <div class="role-switch" role="tablist" aria-label="Account type">
      <button type="button" class="seg-btn active" role="tab" aria-selected="true" data-role="chairperson">Chairperson</button>
      <button type="button" class="seg-btn" role="tab" aria-selected="false" data-role="faculty">Faculty</button>
    </div>

    <!-- Sign in or create an account -->
    <div class="auth-tabs" role="tablist" aria-label="Sign in or sign up">
      <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-mode="signin">Sign In</button>
      <button type="button" class="tab-btn" role="tab" aria-selected="false" data-mode="signup">Sign Up</button>
    </div>

    <div class="error-msg" id="errorMsg" role="alert"></div>

    <form id="authForm" data-role="chairperson" data-mode="signin" novalidate>

      <div class="login-field only-faculty">
        <label for="facultyName">Faculty member</label>
        <div class="select-wrap">
          <select id="facultyName"></select>
        </div>
        <input type="text" id="facultyManual" class="login-manual" placeholder="Enter your full name" autocomplete="name" autocapitalize="words" hidden>
      </div>

      <div class="login-field only-chair only-signup">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" autocomplete="name" autocapitalize="words">
      </div>

      <div class="login-field">
        <label for="department">Department</label>
        <div class="select-wrap">
          <select id="department">
            <option value="" disabled selected>Select your department</option>
            <option value="IT">Information Technology</option>
            <option value="CS">Computer Science</option>
            <option value="MB">Marine Biology</option>
            <option value="ES">Environmental Science</option>
            <option value="MedB">Medical Biology</option>
          </select>
        </div>
      </div>

      <div class="login-field">
        <label for="email">Corporate email</label>
        <input type="text" id="email" placeholder="yourname@psu.palawan.edu.ph" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false">
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
          <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">Show</button>
        </div>
      </div>

      <div class="login-field only-signup">
        <label for="confirmPassword">Confirm password</label>
        <div class="pw-wrap">
          <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="confirmPassword" aria-label="Show password">Show</button>
        </div>
      </div>

      <button type="submit" class="btn-login-submit" id="submitBtn">Sign In</button>
    </form>
  </main>

</body>
</html>
